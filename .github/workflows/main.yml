name: CI

env:
  SOURCE_ROOT: pywhatwgurl
  WPT_URL_COMMIT: c48d58747e1f211527fb695fd60548a997fae617
  WPT_TEST_DATA_PATH: tests/conformance/data

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the project (including dev tools)
        run: uv sync --locked --all-extras --dev

      - name: Run Ruff
        run: uv run ruff check "${{ env.SOURCE_ROOT }}"

      - name: Run mypy
        run: uv run mypy "${{ env.SOURCE_ROOT }}"

      - name: Run pip-audit
        run: |
          uv export --no-dev --no-hashes --no-emit-project | grep -v '^\s*#' > /tmp/requirements.txt
          uv run pip-audit --disable-pip --no-deps -r /tmp/requirements.txt

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fetch WPT URL resources
        uses: ./.github/workflows/actions/fetch_wpt_url_test_data
        with:
          commit: ${{ env.WPT_URL_COMMIT }}
          dest_dir: ${{ env.WPT_TEST_DATA_PATH }}

      - name: Install the project
        run: uv sync --python "${{ matrix.python-version }}" --locked --all-extras --dev

      - name: Identify test interpreter and Unicode dependencies
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run --no-sync --python "$EXPECTED_PYTHON" python - <<'PY'
          import os
          import sys
          import sysconfig
          import unicodedata

          import idna

          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          print(f"Python: {sys.version} ({sys.executable})")
          print(f"idna: {idna.__version__}")
          print(f"Unicode: {unicodedata.unidata_version}")
          print(f"GIL-enabled build: {not bool(sysconfig.get_config_var('Py_GIL_DISABLED'))}")
          assert actual == os.environ["EXPECTED_PYTHON"]
          assert sys.implementation.name == "cpython"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED")
          PY

      - name: Run tests
        run: uv run --no-sync --python "${{ matrix.python-version }}" python -m pytest
